name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # CI builds sort below every release, so an installed CI build updates in place to the latest
      # release (the smoke test checks that path end to end).
      - name: Compute version
        run: |
          echo "VERSION_CODE=1" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.0.$(git rev-list --count HEAD)-ci" >> "$GITHUB_ENV"

      - name: Build release APK, run unit tests and lint
        env:
          LIVE_API_TEST: "1"
        run: |
          set -o pipefail
          ./gradlew --continue \
            assembleRelease assembleDebug testReleaseUnitTest lintRelease \
            -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME -PupdateRepo=$GITHUB_REPOSITORY \
            2>&1 | tee build.log

      - name: Summarize failures
        if: failure()
        run: |
          echo "===== Failure summary ====="
          grep -E "^e: |: Error: |error: |FAILED|What went wrong|Execution failed|Could not resolve|Caused by" build.log | head -n 300

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: nimbus-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  smoke-test:
    name: Emulator smoke test (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Several emulator setups while finding one that stays up on the hosted runners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api34-no-vulkan
            api-level: 34
            target: google_apis
            extra-options: -feature -Vulkan
          - name: api34-aosp
            api-level: 34
            target: default
            extra-options: ""
          - name: api31
            api-level: 31
            target: google_apis
            extra-options: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nimbus-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install screenshot tooling
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          # The software-rendered emulator stalls on continuous animation; with animations off the
          # app's reduce-motion path draws the sky as a still frame.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot ${{ matrix.extra-options }}
          script: bash .github/scripts/smoke-test.sh apks smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots-${{ matrix.name }}
          path: smoke/
          retention-days: 14
