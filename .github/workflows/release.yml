name: Release

# Every push to main builds a signed APK and publishes it as a GitHub Release.
# The app checks this repository's latest release to offer in-app updates.
# Keep this file's name stable; version numbers come from the commit count on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$COUNT" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$COUNT" >> "$GITHUB_ENV"
          echo "TAG=v1.0.$COUNT" >> "$GITHUB_ENV"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Optional: use a private signing key from repository secrets instead of the key in signing/.
      - name: Decode signing key from secrets
        if: steps.existing.outputs.exists == 'false'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the signing key from repository secrets."
          else
            echo "Using the signing key committed in signing/."
          fi

      - name: Build and test
        if: steps.existing.outputs.exists == 'false'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew --stacktrace assembleRelease testReleaseUnitTest
          -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME -PupdateRepo=$GITHUB_REPOSITORY

      - name: Verify signature and prepare APK
        if: steps.existing.outputs.exists == 'false'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer|SHA-256"
          cp app/build/outputs/apk/release/app-release.apk "Nimbus-$TAG.apk"

      - name: Write release notes
        if: steps.existing.outputs.exists == 'false'
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --pretty='- %s' "$PREVIOUS"..HEAD
            else
              git log --no-merges --pretty='- %s' -n 30
            fi
            echo
            echo "## Install"
            echo
            echo "Download **Nimbus-$TAG.apk** below and open it on your phone. If you already have Nimbus, it will also offer this update in the app."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "Nimbus-$TAG.apk" \
            --title "Nimbus $VERSION_NAME" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
