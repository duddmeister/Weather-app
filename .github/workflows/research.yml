name: Research (temporary)

# Temporary: surveys warning feeds and forecast samples that the development sandbox can't reach,
# and publishes them to the ci-screenshots branch for review. Removed before merging.
on:
  push:
    branches: [claude/android-weather-app-jxwtyy]
    paths: [.github/workflows/research.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Survey every MeteoAlarm country
        run: |
          mkdir -p out && cd out
          python3 - <<'PY'
          import json, urllib.request, gzip, time
          slugs = ["austria", "belgium", "bosnia-herzegovina", "bulgaria", "croatia", "cyprus", "czechia", "czech-republic",
                   "denmark", "estonia", "finland", "france", "germany", "greece", "hungary", "iceland", "ireland", "israel",
                   "italy", "latvia", "lithuania", "luxembourg", "malta", "moldova", "republic-of-moldova", "montenegro",
                   "netherlands", "north-macedonia", "republic-of-north-macedonia", "norway", "poland", "portugal", "romania",
                   "serbia", "slovakia", "slovenia", "spain", "sweden", "switzerland", "ukraine", "united-kingdom"]
          summary = {}
          for slug in slugs:
              url = f"https://feeds.meteoalarm.org/api/v1/warnings/feeds-{slug}"
              req = urllib.request.Request(url, headers={"User-Agent": "Nimbus weather app (github.com/duddmeister/Weather-app)", "Accept-Encoding": "gzip"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      wire = len(raw)
                      if r.headers.get("Content-Encoding") == "gzip":
                          raw = gzip.decompress(raw)
                      d = json.loads(raw)
              except Exception as e:
                  summary[slug] = {"error": str(e)[:120]}
                  continue
              poly = codes = 0
              langs = set()
              kinds = set()
              for w in d.get("warnings", []):
                  for info in w["alert"].get("info", []):
                      langs.add(info.get("language"))
                      for ar in info.get("area", []):
                          if ar.get("polygon"): poly += 1
                          else: codes += 1
                          for g in ar.get("geocode") or []: kinds.add(g.get("valueName"))
              summary[slug] = {"warnings": len(d.get("warnings", [])), "areas_with_polygon": poly, "areas_codes_only": codes,
                               "code_types": sorted(k for k in kinds if k), "languages": sorted(l for l in langs if l),
                               "bytes_on_wire": wire, "bytes": len(raw)}
              time.sleep(0.5)
          json.dump(summary, open("meteoalarm-survey.json", "w"), indent=1)
          for k, v in summary.items(): print(k, v)
          PY

      - name: Publish to the ci-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Research fetch for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
