name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$COUNT" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$COUNT-dev" >> "$GITHUB_ENV"

      - name: Build release APK, run unit tests and lint
        env:
          LIVE_API_TEST: "1"
        run: |
          set -o pipefail
          ./gradlew --continue \
            assembleRelease assembleDebug testReleaseUnitTest lintRelease \
            -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME -PupdateRepo=$GITHUB_REPOSITORY \
            2>&1 | tee build.log

      - name: Summarize failures
        if: failure()
        run: |
          echo "===== Failure summary ====="
          grep -E "^e: |: Error: |error: |FAILED|What went wrong|Execution failed|Could not resolve|Caused by" build.log | head -n 300

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: nimbus-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  smoke-test:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nimbus-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install screenshot tooling
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The software-rendered emulator stalls on continuous animation; with animations off the
          # app's reduce-motion path draws the sky as a still frame.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/smoke-test.sh apks smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: smoke/
          retention-days: 14

      # Temporary, for reviewing UI changes during development: publishes the thumbnails to a scratch branch.
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d smoke/thumbs ] || exit 0
          tmp=$(mktemp -d)
          cp smoke/thumbs/*.jpg "$tmp"/ 2>/dev/null || true
          cp smoke/app-log.txt "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke test screenshots for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
