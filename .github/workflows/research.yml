name: Research (temporary)

# Temporary: surveys warning feeds and forecast samples that the development sandbox can't reach,
# and publishes them to the ci-screenshots branch for review. Removed before merging.
on:
  push:
    branches: [claude/android-weather-app-jxwtyy]
    paths: [.github/workflows/research.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check caching headers
        run: |
          mkdir -p out && cd out
          ua="Nimbus weather app (github.com/duddmeister/Weather-app)"
          url="https://feeds.meteoalarm.org/api/v1/warnings/feeds-united-kingdom"
          {
            echo "== first request"
            curl -sS -A "$ua" -H "Accept-Encoding: gzip, br" -D - -o first.json "$url" | tr -d '\r'
            etag=$(curl -sS -A "$ua" -D - -o /dev/null "$url" | tr -d '\r' | awk 'tolower($1)=="etag:" {print $2}')
            modified=$(curl -sS -A "$ua" -D - -o /dev/null "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="last-modified" {print $2}')
            echo "etag=[$etag] last-modified=[$modified]"
            echo "== If-None-Match"
            [ -n "$etag" ] && curl -sS -A "$ua" -H "If-None-Match: $etag" -D - -o /dev/null -w "status %{http_code} bytes %{size_download}\n" "$url" | tr -d '\r'
            echo "== If-Modified-Since"
            [ -n "$modified" ] && curl -sS -A "$ua" -H "If-Modified-Since: $modified" -D - -o /dev/null -w "status %{http_code} bytes %{size_download}\n" "$url" | tr -d '\r'
            echo "== Atom feed headers"
            curl -sS -A "$ua" -I "https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-united-kingdom" | tr -d '\r'
          } > headers.txt 2>&1
          cat headers.txt
          rm -f first.json

      - name: Publish to the ci-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Research fetch for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
